root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -tags dev -o ./tmp/main ./cmd/server"
entrypoint = "./tmp/main"
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["tmp", "vendor", ".git", "web"]
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "1s"

[log]
time = true

[misc]
clean_on_exit = true
